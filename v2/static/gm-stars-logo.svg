<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" role="img" aria-label="GM Stars basketball and star logo">
  <defs>
    <radialGradient id="ball-fill" cx="50%" cy="48%" r="68%">
      <stop offset="0" stop-color="#f5bd4f" stop-opacity=".14"/>
      <stop offset="1" stop-color="#f5bd4f" stop-opacity=".015"/>
    </radialGradient>
  </defs>

  <!-- Soft rings carry over the gold glow from the home-page artwork. -->
  <circle cx="150" cy="150" r="148" fill="#f5bd4f" opacity=".018"/>
  <circle cx="150" cy="150" r="135" fill="#f5bd4f" opacity=".022"/>

  <!-- Ball outline and curved seams. -->
  <circle cx="150" cy="150" r="123" fill="url(#ball-fill)"
          stroke="#f5bd4f" stroke-opacity=".62" stroke-width="2"
          vector-effect="non-scaling-stroke"/>
  <g fill="none" stroke="#f5bd4f" stroke-opacity=".42" stroke-width="2"
     stroke-linecap="round" vector-effect="non-scaling-stroke">
    <path d="M27 150 C68 99 232 99 273 150"/>
    <path d="M27 150 C68 201 232 201 273 150"/>
  </g>

  <!-- Center star. -->
  <g transform="translate(150 150) scale(.64) translate(-150 -150)">
    <path d="m150 111 11.5 25.2 27.5 3.2-20.3 18.8 5.4 27.2-24.1-13.6-24.1 13.6 5.4-27.2-20.3-18.8 27.5-3.2z"
          fill="#f5bd4f"/>
  </g>
</svg>
